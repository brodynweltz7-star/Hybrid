   if(mode==='normal'&&!deload&&km>=5){
    const warm=1.5,work=v.n*v.m/1000,recover=(v.n-1)*v.rest/1000;

     x={effort:pace.interval,detail:`Track progression: Warm up ${warm.toFixed(1)} km easy; ${v.n} × ${v.m} m at controlled interval effort (${pace.interval}), with ${v.rest} m walk/jog between repetitions; Cool down ${cool.toFixed(1)} km easy; Total ${km.toFixed(1)} km. Keep the reps controlled; do not increase intensity to compensate for missed weeks.`};

    }else{

    }

   }

  }
  
  else if([1,2].includes(block)&&i===5){x=quality(km,block===2?'thresholdLong':'threshold');d.title='Saturday threshold';}

  else if(block===5&&i===5){

  else if(coach.mode==='normal'&&adjust&&adjust.easy&&i===5&&block===0){x=easy(km,'easy');d.title='Easy aerobic — lighter week';x.detail+=' '+adjust.why+'. Threshold resumes after consistent completed weeks.';}

 });
 // Race day must override the regular Sunday recovery slot and never be double-counted.
 for(let i=0;i<7;i++){const r=race[plus(w,i)];if(r)ds[i]={title:'RACE DAY',type:'run',target:r[0],effort:'Race-day strategy',detail:`${r[1]}. Follow your race plan; no fixed training pace.`};}
 ds.forEach((d,i)=>{
  const date=plus(w,i),override=adaptiveState().dayOverrides[date]||{};

  }
  if(override.effort){d.effort=override.effort;if(d.target>0)d.detail+=` Target pace (manual): ${override.effort}.`;}
  else if(d.effort)d.effort=adaptivePace(d.effort);
  if(!override.effort)d.detail=adaptivePace(d.detail);
 });
 // Add a clear, phase-aware mobility routine to every day's visible instructions.
 ds.forEach((d,i)=>{const date=plus(w,i);d.detail+='; '+recoveryRoutine(d,i,block,Boolean(race[date]));});
 return ds;
}
